<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>German Whist — Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root {
    --felt-950: #081b16;
    --felt-900: #0c241e;
    --felt-800: #123028;
    --felt-700: #1a4034;
    --line: rgba(246, 241, 227, 0.10);
    --ivory: #f6f1e3;
    --ivory-dim: #e9e0c9;
    --ink: #20211f;
    --suit-red: #b3372c;
    --brass: #d5a44c;
    --brass-soft: rgba(213, 164, 76, 0.16);
    --text: #e8e2d0;
    --muted: #93ac9f;
    --shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    --radius: 10px;
    --serif: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: var(--sans);
    color: var(--text);
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, var(--felt-700), transparent 60%),
      linear-gradient(180deg, var(--felt-800), var(--felt-900) 55%, var(--felt-950));
    background-attachment: fixed;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(16px + env(safe-area-inset-bottom));
  }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  h1.brand {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 2.4rem;
    letter-spacing: 0.02em;
    color: var(--ivory);
    text-wrap: balance;
  }
  .brand .suits { color: var(--brass); font-size: 1.4rem; letter-spacing: 0.25em; display: block; margin-top: 6px; }

  .eyebrow {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--muted);
  }

  button { font-family: var(--sans); border: none; cursor: pointer; touch-action: manipulation; }

  .btn {
    width: 100%;
    padding: 15px 20px;
    border-radius: var(--radius);
    font-size: 1.05rem;
    font-weight: 600;
    background: var(--brass);
    color: var(--felt-950);
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .btn:active { transform: scale(0.985); }
  .btn:disabled { opacity: 0.35; pointer-events: none; box-shadow: none; }

  .btn-quiet {
    width: 100%;
    padding: 13px 20px;
    border-radius: var(--radius);
    font-size: 0.95rem;
    font-weight: 500;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
  }

  .btn:focus-visible, .btn-quiet:focus-visible, .card:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 2px;
  }

  .card {
    width: 62px;
    height: 88px;
    border-radius: 7px;
    background: linear-gradient(160deg, var(--ivory), var(--ivory-dim));
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6px 7px;
    font-family: var(--serif);
    flex-shrink: 0;
    position: relative;
    border: 1px solid rgba(0, 0, 0, 0.25);
    user-select: none;
    -webkit-user-select: none;
  }
  .card .corner { font-size: 1rem; line-height: 1.05; font-weight: 600; }
  .card .corner.bottom { align-self: flex-end; transform: rotate(180deg); }
  .card .pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.7rem; opacity: 0.85; }
  .card.red { color: var(--suit-red); }

  .card.back {
    background: repeating-linear-gradient(45deg, var(--felt-700) 0 5px, var(--felt-800) 5px 10px);
    border: 1px solid var(--brass-soft);
    box-shadow: inset 0 0 0 3px rgba(213, 164, 76, 0.25), 0 2px 6px rgba(0, 0, 0, 0.4);
  }

  .card.big { width: 76px; height: 108px; }
  .card.big .corner { font-size: 1.2rem; }
  .card.big .pip { font-size: 2.2rem; }

  .status {
    display: flex;
    align-items: stretch;
    gap: 8px;
    padding: 10px 0 12px;
  }
  .status .cell {
    flex: 1;
    background: rgba(0, 0, 0, 0.22);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 7px 10px;
    text-align: center;
  }
  .status .cell .eyebrow { font-size: 0.6rem; display: block; margin-bottom: 2px; }
  .status .cell .val {
    font-family: var(--serif);
    font-size: 1.1rem;
    color: var(--ivory);
    font-variant-numeric: tabular-nums;
  }
  .status .val .red { color: #e0705f; }
  .status .val .brassy { color: var(--brass); }

  .conn {
    display: flex;
    justify-content: center;
    padding-bottom: 8px;
  }
  .conn .pill {
    font-size: 0.72rem;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .conn .pill.ok { color: var(--felt-950); background: var(--muted); border-color: transparent; }
  .conn .pill.warn { color: var(--felt-950); background: var(--brass); border-color: transparent; }

  .turn-banner {
    text-align: center;
    font-family: var(--serif);
    font-size: 1.15rem;
    color: var(--ivory);
    padding-bottom: 4px;
  }
  .phase-note {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    padding-bottom: 8px;
  }

  .table {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 0;
    min-height: 150px;
  }
  .table .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .table .slot .eyebrow { font-size: 0.62rem; }
  .stake-wrap { display: flex; gap: 10px; align-items: center; }

  .note {
    font-size: 0.85rem;
    color: var(--muted);
    text-align: center;
    max-width: 34ch;
  }
  .note strong { color: var(--brass); font-weight: 600; }

  .hand-area { padding-top: 6px; }
  .hand-label { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px 8px; }
  .hand { display: flex; overflow-x: auto; padding: 14px 8px 6px; scrollbar-width: none; }
  .hand::-webkit-scrollbar { display: none; }
  .hand .card { margin-left: -22px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .hand .card:first-child { margin-left: 0; }
  .hand .card.selected {
    transform: translateY(-14px);
    box-shadow: 0 0 0 2px var(--brass), 0 8px 18px rgba(0, 0, 0, 0.5);
    z-index: 2;
  }
  .hand .card.illegal { filter: brightness(0.5) saturate(0.6); }
  .hand.frozen .card { filter: saturate(0.75); opacity: 0.9; }
  .hand .card.drawn::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 7px;
    box-shadow: inset 0 0 0 2px var(--brass);
    pointer-events: none;
  }

  .play-cta { padding-top: 12px; min-height: 66px; }
  .hint { text-align: center; font-size: 0.8rem; color: var(--muted); padding-top: 8px; min-height: 1.2em; }

  /* home */
  #screen-home { justify-content: center; gap: 24px; text-align: center; }
  .fields { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .fields label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 5px; }
  .fields input {
    width: 100%;
    padding: 13px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.25);
    color: var(--ivory);
    font-size: 1rem;
    font-family: var(--sans);
  }
  .fields input:focus-visible { outline: 2px solid var(--brass); outline-offset: 0; }
  .fields input.code { text-transform: uppercase; letter-spacing: 0.3em; font-family: var(--serif); font-size: 1.2rem; text-align: center; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 0.75rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* waiting */
  #screen-wait { justify-content: center; align-items: center; gap: 20px; text-align: center; }
  .room-code {
    font-family: var(--serif);
    font-size: 3rem;
    letter-spacing: 0.28em;
    color: var(--brass);
    padding-left: 0.28em; /* balances the letter-spacing trailing gap */
  }

  .trick-verdict { font-family: var(--serif); font-size: 1.5rem; color: var(--ivory); text-wrap: balance; }

  /* trick resolution on the table: winner's card slides over the loser's */
  .duel { position: relative; width: 176px; height: 122px; }
  .duel .dcard { position: absolute; top: 0; transition: transform 0.45s ease, filter 0.45s ease; }
  .duel .dcard.lose { left: 12px; transform: rotate(-3deg); }
  .duel .dcard.win { right: 12px; transform: rotate(4deg); z-index: 2; }
  .duel.resolved .dcard.win { transform: translate(-46px, -10px) rotate(-6deg); }
  .duel.resolved .dcard.lose { transform: rotate(-2deg) scale(0.96); filter: brightness(0.7); }

  /* fleeting take-notice, no blocking popup */
  .toast {
    position: fixed;
    top: 16%;
    left: 50%;
    transform: translateX(-50%);
    max-width: 88vw;
    background: rgba(8, 27, 22, 0.92);
    border: 1px solid var(--brass-soft);
    color: var(--ivory);
    font-family: var(--serif);
    font-size: 1.05rem;
    padding: 10px 20px;
    border-radius: 999px;
    text-align: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s;
    pointer-events: none;
    z-index: 20;
  }
  .toast.show { opacity: 1; visibility: visible; }

  /* drawn card: enlarged for a beat, then glides down into the hand */
  #draw-flash {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(8, 27, 22, 0.55);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s ease, visibility 0.25s;
    pointer-events: none;
    z-index: 15;
  }
  #draw-flash.show { opacity: 1; visibility: visible; }
  #draw-flash .card {
    transform: scale(1.3);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    transition: transform 0.45s ease, opacity 0.45s ease;
  }
  #draw-flash.tohand { opacity: 0; }
  #draw-flash.tohand .card { transform: translateY(36vh) scale(0.55); opacity: 0.15; }

  .hand.presenting { pointer-events: none; }

  /* game over */
  #screen-over { justify-content: center; align-items: center; gap: 18px; text-align: center; }
  .final-score { font-family: var(--serif); font-size: 3.4rem; color: var(--ivory); font-variant-numeric: tabular-nums; }
  .match-tally { font-size: 0.9rem; color: var(--muted); }
  .over-actions { width: 100%; display: flex; flex-direction: column; gap: 10px; padding-top: 10px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main id="app">

  <!-- ============ HOME ============ -->
  <section class="screen" id="screen-home">
    <div>
      <h1 class="brand">German Whist<span class="suits">♠ ♥ ♦ ♣</span></h1>
      <p class="note" style="margin: 10px auto 0;">Due telefoni, una partita. Uno crea la stanza, l'altra si unisce col codice.</p>
    </div>

    <div class="fields">
      <div>
        <label for="my-name">Il tuo nome</label>
        <input id="my-name" type="text" maxlength="14" placeholder="Come ti chiami?" autocomplete="off">
      </div>
    </div>

    <button class="btn" id="btn-create">Crea una stanza</button>

    <div class="divider">oppure</div>

    <div class="fields">
      <div>
        <label for="join-code">Codice stanza</label>
        <input id="join-code" class="code" type="text" maxlength="4" placeholder="····" autocomplete="off" autocapitalize="characters">
      </div>
    </div>
    <button class="btn-quiet" id="btn-join">Unisciti alla stanza</button>

    <button class="btn-quiet" id="btn-resume-online" hidden></button>
    <p class="hint" id="home-error"></p>
    <p class="hint" id="build-tag"></p>
  </section>

  <!-- ============ WAITING ============ -->
  <section class="screen" id="screen-wait">
    <p class="eyebrow" id="wait-eyebrow">Codice stanza</p>
    <p class="room-code" id="room-code"></p>
    <p class="note" id="wait-note"></p>
    <p class="hint" id="relay-status"></p>
    <button class="btn" id="btn-share" hidden>Manda l'invito</button>
    <button class="btn-quiet" id="btn-wait-back">Annulla</button>
  </section>

  <!-- ============ PLAY ============ -->
  <section class="screen" id="screen-play">
    <div class="conn"><span class="pill" id="conn-pill"></span></div>
    <div class="status">
      <div class="cell">
        <span class="eyebrow">Briscola</span>
        <span class="val" id="st-trump"></span>
      </div>
      <div class="cell">
        <span class="eyebrow">Tallone</span>
        <span class="val" id="st-stock"></span>
      </div>
      <div class="cell">
        <span class="eyebrow" id="st-score-label">Prese</span>
        <span class="val" id="st-score"></span>
      </div>
    </div>
    <p class="turn-banner" id="turn-banner"></p>
    <p class="phase-note" id="phase-note"></p>

    <div class="table" id="table-area"></div>

    <div class="hand-area">
      <div class="hand-label">
        <span class="eyebrow" id="hand-owner"></span>
        <span class="eyebrow" id="hand-count"></span>
      </div>
      <div class="hand" id="hand"></div>
      <p class="hint" id="play-hint"></p>
      <div class="play-cta">
        <button class="btn" id="btn-play" disabled>Scegli una carta</button>
      </div>
    </div>
  </section>

  <!-- ============ GAME OVER ============ -->
  <section class="screen" id="screen-over">
    <p class="eyebrow">Fine della partita</p>
    <p class="trick-verdict" id="over-title"></p>
    <p class="final-score" id="over-score"></p>
    <p class="match-tally" id="over-tally"></p>
    <div class="over-actions">
      <button class="btn" id="btn-rematch" hidden>Rivincita</button>
      <p class="note" id="over-wait" hidden></p>
      <button class="btn-quiet" id="btn-leave">Esci dalla stanza</button>
    </div>
  </section>

</main>

<div class="toast" id="trick-toast"></div>
<div id="draw-flash"></div>

<script src="game-logic.js"></script>
<script type="module">
"use strict";
import { schnorr } from "./schnorr.min.js";
(() => {
  const GW = globalThis.GW;
  const SUIT_GLYPH = { S: "♠", H: "♥", D: "♦", C: "♣" };
  const SUIT_NAME = { S: "Picche", H: "Cuori", D: "Quadri", C: "Fiori" };
  const RED = { H: true, D: true };
  const CODE_ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no O/0, I/1/L
  /* Public Nostr relays used to carry the (encrypted) game messages.
     List taken verbatim from @trystero-p2p/nostr 0.25.3 defaultRelayUrls.
     Both phones pick the same deterministic subset from the room code,
     publish every message to all of them and dedupe on receipt — one
     working relay is enough. No direct phone-to-phone channel, so NAT
     and TURN servers are out of the picture entirely. */
  const RELAY_HOSTS = [
    "basspistol.org", "bucket.coracle.social", "chorus.almostmachines.dev",
    "chorus.pjv.me", "communities.nos.social", "ftp.halifax.rwth-aachen.de/nostr",
    "hol.is", "hornetstorage.net/relay", "koru.bitcointxoko.org", "nos.lol",
    "nostr-01.uid.ovh", "nostr-01.yakihonne.com", "nostr-relay.corb.net",
    "nostr.data.haus", "nostr.islandarea.net", "nostr.sathoarder.com",
    "nostr.self-determined.de", "nostr.tegila.com.br", "nostr.vulpem.com",
    "purplerelay.com", "relay-can.zombi.cloudrodion.com", "relay-rpi.edufeed.org",
    "relay.agorist.space", "relay.angor.io", "relay.artio.inf.unibe.ch",
    "relay.binaryrobot.com", "relay.damus.io", "relay.froth.zone",
    "relay.libernet.app", "relay.mostr.pub", "relay.mostro.network",
    "relay.nostr.place", "relay.nostrdice.com", "relay.notoshi.win",
    "relay.sigit.io", "relay02.lnfi.network", "relay2.angor.io", "schnorr.me",
    "slick.mjex.me", "social.amanah.eblessing.co", "staging.yabu.me",
    "strfry.openhoofd.nl", "strfry.shock.network", "testnet-relay.samt.st",
    "top.testrelay.top", "x.kojira.io", "yabu.me/v2",
  ];
  const RELAY_COUNT = 8;      // relays each phone connects to
  const EVENT_KIND = 24478;   // ephemeral range: relays broadcast, don't store

  const BUILD = "v6";
  const CHUNK_SIZE = 800;     // some relays cap event size; split big payloads

  const params = new URLSearchParams(location.search);
  // test hook: point the signaling layer at a local Nostr relay
  const RELAY_OVERRIDE = params.get("relay");
  // test hook: the automated tests run both "phones" as tabs of one browser
  // profile, which would share localStorage; ?sid= namespaces the keys.
  const SID = params.get("sid") ? "-" + params.get("sid") : "";
  const HOST_KEY = "gw-online-host-v1" + SID;
  const GUEST_KEY = "gw-online-guest-v1" + SID;
  const TRANSPORT = params.get("t") === "bc" ? "bc" : "peer";
  // test hook: records every message this page receives (BroadcastChannel runs only)
  if (TRANSPORT === "bc") globalThis.__received = [];

  const $ = (id) => document.getElementById(id);

  /* ================= session state ================= */

  let role = null;            // 'host' | 'guest'
  let room = null;
  let myName = "";
  let link = null;            // transport handle
  let connected = false;
  let awaitingView = false;   // a play was sent; ignore further card taps until the next view
  let presenting = false;     // a trick presentation is running on this device
  let pendingView = null;     // freshest view that arrived during a presentation

  const FAST = params.get("fast") === "1";  // test hook: collapse animation holds
  const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HOLD = FAST || REDUCED
    ? { settle: 30, fight: 50, toast: 80, draw: 80, glide: 40 }
    : { settle: 60, fight: 500, toast: 1000, draw: 1300, glide: 450 };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // host-only authoritative state
  let game = null;
  let names = { A: "", B: "" };
  let matchWins = { A: 0, B: 0 };
  let nextFirstLeader = "A";
  let scored = false;

  // both sides: last rendered view + interaction state
  let view = null;
  let selected = null;
  let overlayShownFor = 0;    // lastTrick.num already shown to this device
  let seenFirstView = false;  // first view after page load: sync, don't replay old tricks
  let lastViewAt = 0;

  /* ================= persistence ================= */

  function saveHost() {
    try {
      localStorage.setItem(HOST_KEY, JSON.stringify({ room, myName, game, names, matchWins, nextFirstLeader, scored }));
    } catch (e) {}
  }
  function saveGuest() {
    try { localStorage.setItem(GUEST_KEY, JSON.stringify({ room, myName })); } catch (e) {}
  }
  function loadKey(key) {
    try {
      const s = JSON.parse(localStorage.getItem(key));
      return s && typeof s === "object" ? s : null;
    } catch (e) { return null; }
  }
  function clearSession() {
    try { localStorage.removeItem(HOST_KEY); localStorage.removeItem(GUEST_KEY); } catch (e) {}
  }

  /* ================= transports =================
     link = { send(obj), close() }; callbacks:
       onUp()        link established (host: guest arrived)
       onMsg(obj)    message received
       onDown()      link lost (may come back)
                                                                          */

  /* ---- crypto helpers for the relay transport ---- */
  const te = new TextEncoder();
  const td = new TextDecoder();
  const sha256 = async (str) =>
    new Uint8Array(await crypto.subtle.digest("SHA-256", te.encode(str)));
  const toHex = (bytes) =>
    Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  async function deriveKey(secret) {
    const bits = await sha256("gwhist-key-" + secret);
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["encrypt", "decrypt"]);
  }
  async function encrypt(key, text) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(text)));
    const buf = new Uint8Array(12 + ct.length);
    buf.set(iv);
    buf.set(ct, 12);
    let bin = "";
    for (const b of buf) bin += String.fromCharCode(b);
    return btoa(bin);
  }
  async function decrypt(key, b64) {
    const buf = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    return td.decode(pt);
  }

  /* Both phones must pick the SAME relays: deterministic shuffle by code. */
  function pickRelays() {
    if (RELAY_OVERRIDE) return [RELAY_OVERRIDE];
    let seed = 0;
    for (const c of "gw-" + room.toUpperCase()) seed = (seed * 31 + c.charCodeAt(0)) >>> 0;
    const rand = GW.mulberry32(seed);
    const urls = RELAY_HOSTS.map((h) => "wss://" + h);
    for (let i = urls.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [urls[i], urls[j]] = [urls[j], urls[i]];
    }
    return urls.slice(0, RELAY_COUNT);
  }

  /* Nostr relay transport: every message is an encrypted, signed,
     ephemeral Nostr event published to all connected relays; receipt is
     deduped by event id and ordered by a per-sender sequence number.
     Presence comes from heartbeats — no direct connection ever needed. */
  function startNostrTransport(cb) {
    const topic = "gwx4-" + room.toUpperCase();
    const myId = Math.random().toString(36).slice(2, 10);
    const keyPromise = deriveKey(topic);
    const { secretKey, publicKey } = schnorr.keygen();
    const pubkey = toHex(publicKey);
    const sockets = new Map();     // url -> WebSocket
    const seenIds = new Set();
    const lastSeq = {};
    const partial = new Map();     // mid -> {parts, got, n, ts} chunk reassembly
    let seq = 0;
    let closed = false;
    let up = false;
    let lastHeard = 0;
    let lastReject = "";

    function heard() {
      lastHeard = Date.now();
      if (!up) {
        up = true;
        publish({ t: "hb" });   // answer right away so the other side pairs fast
        cb.onUp();
      }
    }
    function down() {
      if (up) { up = false; cb.onDown(); }
    }

    function connect(url) {
      if (closed) return;
      let ws;
      try { ws = new WebSocket(url); } catch (e) { return; }
      sockets.set(url, ws);
      ws.onopen = () => {
        ws.send(JSON.stringify(["REQ", "gw-" + myId, {
          kinds: [EVENT_KIND],
          "#x": [topic],
          since: Math.floor(Date.now() / 1000) - 30,
        }]));
      };
      ws.onmessage = async (ev) => {
        let m;
        try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m[0] === "OK" && m[2] === false) {
          lastReject = String(m[3] || "rifiutato");
          console.warn("relay rejected event:", url, lastReject);
          return;
        }
        if (m[0] === "NOTICE") { console.warn("relay notice:", url, m[1]); return; }
        if (m[0] !== "EVENT") return;
        const evt = m[2];
        if (!evt || !evt.id || seenIds.has(evt.id)) return;
        seenIds.add(evt.id);
        if (seenIds.size > 3000) {
          const it = seenIds.values();
          for (let i = 0; i < 1500; i++) seenIds.delete(it.next().value);
        }
        // chunk wrapper: {m: messageId, i: index, n: total, p: cipher piece}
        let wrap;
        try { wrap = JSON.parse(evt.content); } catch (e) { return; }
        if (!wrap || typeof wrap.m !== "string" || !(wrap.n >= 1) || typeof wrap.p !== "string") return;
        let cipher;
        if (wrap.n === 1) {
          cipher = wrap.p;
        } else {
          const buf = partial.get(wrap.m) || { parts: [], got: 0, n: wrap.n, ts: Date.now() };
          if (buf.parts[wrap.i] === undefined) { buf.parts[wrap.i] = wrap.p; buf.got++; }
          partial.set(wrap.m, buf);
          if (buf.got < buf.n) return;
          partial.delete(wrap.m);
          cipher = buf.parts.join("");
        }
        let env;
        try { env = JSON.parse(await decrypt(await keyPromise, cipher)); } catch (e) { return; }
        if (!env || env.from === myId) return;
        if (env.seq <= (lastSeq[env.from] ?? -1)) return;
        lastSeq[env.from] = env.seq;
        heard();
        if (!env.data || env.data.t === "hb") return;
        cb.onMsg(env.data);
      };
      ws.onclose = () => {
        sockets.delete(url);
        if (!closed) setTimeout(() => connect(url), 3000 + Math.random() * 2000);
      };
      ws.onerror = () => { try { ws.close(); } catch (e) {} };
    }
    pickRelays().forEach(connect);

    async function publishEvent(content) {
      const created_at = Math.floor(Date.now() / 1000);
      const payload = { kind: EVENT_KIND, tags: [["x", topic]], created_at, content, pubkey };
      const idBytes = await sha256(JSON.stringify(
        [0, payload.pubkey, created_at, payload.kind, payload.tags, content]
      ));
      const signed = JSON.stringify(["EVENT", {
        ...payload,
        id: toHex(idBytes),
        sig: toHex(await schnorr.signAsync(idBytes, secretKey)),
      }]);
      for (const ws of sockets.values()) {
        if (ws.readyState === 1) { try { ws.send(signed); } catch (e) {} }
      }
    }

    async function publish(data) {
      if (closed) return;
      const env = { from: myId, seq: seq++, data };
      const cipher = await encrypt(await keyPromise, JSON.stringify(env));
      const mid = myId + "-" + env.seq;
      const n = Math.max(1, Math.ceil(cipher.length / CHUNK_SIZE));
      for (let i = 0; i < n; i++) {
        await publishEvent(JSON.stringify({
          m: mid, i, n, p: cipher.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE),
        }));
      }
    }

    const presenceTimer = setInterval(() => {
      publish({ t: "hb" });
      if (up && Date.now() - lastHeard > 28000) down();
      for (const [mid, buf] of partial) {
        if (Date.now() - buf.ts > 120000) partial.delete(mid);
      }
    }, 9000);
    publish({ t: "hb" });

    return {
      send: (obj) => { publish(obj); },
      close: () => {
        closed = true;
        clearInterval(presenceTimer);
        for (const ws of sockets.values()) { try { ws.close(); } catch (e) {} }
        sockets.clear();
      },
      relayCount: () => {
        let n = 0;
        for (const ws of sockets.values()) if (ws.readyState === 1) n++;
        return n;
      },
      rejectReason: () => lastReject,
    };
  }

  /* BroadcastChannel transport — same-origin only; used by the automated
     tests to drive two pages without a network. */
  function startBcTransport(cb) {
    const me = role;
    const ch = new BroadcastChannel("gw-room-" + room);
    let up = false;
    let closed = false;
    const sayBye = () => {
      closed = true;   // a dying page must not answer any further handshakes
      try { ch.postMessage({ from: me, ctl: "bye" }); } catch (e) {}
    };
    window.addEventListener("beforeunload", sayBye);
    ch.onmessage = (ev) => {
      const env = ev.data;
      if (closed || !env || env.from === me) return;
      if (env.ctl === "hello" && me === "host") {
        ch.postMessage({ from: me, ctl: "hi" });
        if (!up) { up = true; cb.onUp(); }
        return;
      }
      if (env.ctl === "hi" && me === "guest") {
        if (!up) { up = true; cb.onUp(); }
        return;
      }
      if (env.ctl === "bye") {
        up = false;
        cb.onDown();
        if (me === "guest") startHello();  // keep knocking until the host is back
        return;
      }
      if (env.data !== undefined) {
        if (globalThis.__received) globalThis.__received.push(env.data);
        cb.onMsg(env.data);
      }
    };
    function startHello() {
      const tryHello = setInterval(() => {
        if (closed || up) { clearInterval(tryHello); return; }
        ch.postMessage({ from: me, ctl: "hello" });
      }, 150);
      ch.postMessage({ from: me, ctl: "hello" });
    }
    if (me === "guest") startHello();
    return {
      send: (obj) => { if (!closed) { try { ch.postMessage({ from: me, data: obj }); } catch (e) {} } },
      close: () => {
        if (closed) return;
        closed = true;
        window.removeEventListener("beforeunload", sayBye);
        sayBye();
        ch.close();
      },
    };
  }

  function startLink(cb) {
    if (TRANSPORT === "bc") return startBcTransport(cb);
    return startNostrTransport(cb);
  }

  /* ================= host: game orchestration ================= */

  function applyResult(g) {
    if (!g || !g.winner || scored) return;
    matchWins[g.winner]++;
    nextFirstLeader = GW.other(g.winner);
    scored = true;
    saveHost();
  }

  function viewFor(p) {
    return {
      t: "view",
      you: p,
      names: { A: names.A, B: names.B },
      matchWins: { A: matchWins.A, B: matchWins.B },
      trump: game.trump,
      stockCount: game.stock.length,
      upcard: GW.upcard(game),
      phase: GW.phase(game),
      trickNum: game.trickNum,
      hand: game.hands[p].slice(),
      justDrawn: game.justDrawn[p],
      trick: { A: game.trick.A, B: game.trick.B },
      leader: game.leader,
      turn: game.turn,
      taken: game.taken,
      lastTrick: game.lastTrick,
      winner: game.winner,
    };
  }

  function broadcast() {
    applyResult(game);
    saveHost();
    link.send(viewFor("B"));
    acceptView(viewFor("A"));
  }

  function hostStartGame() {
    const seed = (Math.random() * 0xffffffff) >>> 0;
    game = GW.newGame(seed, nextFirstLeader);
    scored = false;
    overlayShownFor = 0;
    broadcast();
  }

  function hostOnMsg(msg) {
    if (!msg || typeof msg !== "object") return;
    if (msg.t === "join") {
      names.B = String(msg.name || "").slice(0, 14);
      if (!game) hostStartGame();
      else broadcast();       // reconnection: resync the guest
      return;
    }
    if (msg.t === "sync") { if (game) broadcast(); return; }
    if (msg.t === "play") {
      if (!game || game.winner) return;
      if (game.turn !== "B") return;
      // stale message from a previous trick (double-tap race): resync instead
      if (msg.trick !== game.trickNum) { broadcast(); return; }
      if (!GW.legalCards(game, "B").includes(msg.card)) { broadcast(); return; }
      GW.playCard(game, "B", msg.card);
      broadcast();
      return;
    }
  }

  /* ================= guest ================= */

  function guestOnMsg(msg) {
    if (!msg || typeof msg !== "object") return;
    if (msg.t === "view") acceptView(msg);
  }

  /* ================= shared rendering ================= */

  function nameIn(v, p) { return v.names[p] || (p === "A" ? "Giocatore 1" : "Giocatore 2"); }

  function rankLabel(r) { return { 11: "J", 12: "Q", 13: "K", 14: "A" }[r] || String(r); }

  function cardEl(card, opts = {}) {
    const el = document.createElement("div");
    const suit = GW.suitOf(card);
    el.className = "card" + (RED[suit] ? " red" : "") + (opts.big ? " big" : "");
    const label = rankLabel(GW.rankOf(card));
    const glyph = SUIT_GLYPH[suit];
    el.innerHTML =
      '<span class="corner">' + label + "<br>" + glyph + "</span>" +
      '<span class="pip">' + glyph + "</span>" +
      '<span class="corner bottom">' + label + "<br>" + glyph + "</span>";
    el.setAttribute("aria-label", label + " di " + SUIT_NAME[suit]);
    return el;
  }

  function cardBackEl() {
    const el = document.createElement("div");
    el.className = "card back";
    el.setAttribute("aria-label", "Carta coperta");
    return el;
  }

  function cardText(card) { return rankLabel(GW.rankOf(card)) + SUIT_GLYPH[GW.suitOf(card)]; }

  function show(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    $(id).classList.add("active");
    window.scrollTo(0, 0);
  }

  function setConnPill() {
    const pill = $("conn-pill");
    if (connected) { pill.textContent = "Connessi"; pill.className = "pill ok"; }
    else { pill.textContent = "Riconnessione…"; pill.className = "pill warn"; }
  }

  /* A fresh view arrived (host renders its own immediately after a move). */
  function acceptView(v) {
    lastViewAt = Date.now();

    if (!v.lastTrick) overlayShownFor = 0;   // a new game started (rematch)
    if (!seenFirstView) {
      // first view after a page load is a sync: never replay an old trick
      seenFirstView = true;
      overlayShownFor = v.lastTrick ? v.lastTrick.num : 0;
    } else if (v.lastTrick && v.lastTrick.num > overlayShownFor) {
      overlayShownFor = v.lastTrick.num;
      if (presenting) { pendingView = v; return; }
      presentTrick(v);
      return;
    }

    if (presenting) { pendingView = v; return; }
    view = v;
    selected = null;
    awaitingView = false;
    if (v.winner) renderOver();
    else renderPlay();
  }

  /* The trick resolves ON the table: the winning card slides over the
     losing one, the taker's name flashes by, then the drawn card (phase 1)
     shows enlarged for a beat and glides down into the hand. */
  async function presentTrick(v) {
    presenting = true;
    view = v;
    selected = null;
    awaitingView = false;
    const me = role === "host" ? "A" : "B";
    const tk = v.lastTrick;

    renderPlay();
    const handEl = $("hand");
    if (v.justDrawn) {
      // the drawn card arrives visually at the end of the sequence
      const el = handEl.querySelector('[data-card="' + v.justDrawn + '"]');
      if (el) el.remove();
    }
    const takeText = tk.winner === me ? "La presa è tua" : "Presa di " + nameIn(v, tk.winner);
    $("turn-banner").textContent = takeText;
    $("play-hint").textContent = "";

    const table = $("table-area");
    table.innerHTML = "";
    const duel = document.createElement("div");
    duel.className = "duel";
    const loser = GW.other(tk.winner);
    const wl = document.createElement("div");
    wl.className = "dcard lose";
    wl.appendChild(cardEl(tk.cards[loser], { big: true }));
    const ww = document.createElement("div");
    ww.className = "dcard win";
    ww.appendChild(cardEl(tk.cards[tk.winner], { big: true }));
    duel.append(wl, ww);
    table.appendChild(duel);

    await sleep(HOLD.settle);
    duel.classList.add("resolved");
    await sleep(HOLD.fight);
    toast(takeText + (tk.phase === 1 && tk.winner !== me && tk.drawnUp
      ? " · prende " + cardText(tk.drawnUp) : ""));
    await sleep(HOLD.toast);
    hideToast();
    if (tk.phase === 1 && v.justDrawn) await presentDraw(v.justDrawn);

    presenting = false;
    const next = pendingView;
    pendingView = null;
    if (next) { acceptView(next); return; }
    if (v.winner) renderOver();
    else renderPlay();
  }

  async function presentDraw(card) {
    const flash = $("draw-flash");
    flash.innerHTML = "";
    const lbl = document.createElement("p");
    lbl.className = "eyebrow";
    lbl.textContent = "Hai pescato";
    flash.append(lbl, cardEl(card, { big: true }));
    flash.classList.add("show");
    await sleep(HOLD.draw);
    flash.classList.add("tohand");
    await sleep(HOLD.glide);
    flash.classList.remove("show", "tohand");
    flash.innerHTML = "";
  }

  function toast(text) {
    const t = $("trick-toast");
    t.textContent = text;
    t.classList.add("show");
    globalThis.__lastToast = text;   // test hook
  }
  function hideToast() { $("trick-toast").classList.remove("show"); }

  function renderPlay() {
    const v = view;
    const me = role === "host" ? "A" : "B";
    const opp = GW.other(me);
    const myTurn = v.turn === me;

    setConnPill();
    $("st-trump").innerHTML =
      '<span class="' + (RED[v.trump] ? "red" : "brassy") + '">' +
      SUIT_GLYPH[v.trump] + "</span> " + SUIT_NAME[v.trump];
    $("st-stock").textContent = v.stockCount;
    $("st-score-label").textContent = v.phase === 1 ? "Prese" : "Punti";
    const t = v.phase === 1 ? v.taken.p1 : v.taken.p2;
    $("st-score").textContent = t[me] + "–" + t[opp];
    $("turn-banner").textContent = myTurn ? "Tocca a te" : "Aspetta " + nameIn(v, opp) + "…";
    $("phase-note").textContent = v.phase === 1
      ? "Fase 1 · costruisci la mano — queste prese non danno punti"
      : "Fase 2 · ogni presa vale un punto";

    const table = $("table-area");
    table.innerHTML = "";

    if (v.phase === 1 && v.upcard) {
      const stake = document.createElement("div");
      stake.className = "slot";
      const wrap = document.createElement("div");
      wrap.className = "stake-wrap";
      wrap.appendChild(cardEl(v.upcard, { big: true }));
      if (v.stockCount > 1) wrap.appendChild(cardBackEl());
      stake.appendChild(wrap);
      const lbl = document.createElement("span");
      lbl.className = "eyebrow";
      lbl.textContent = "In palio per chi prende";
      stake.appendChild(lbl);
      table.appendChild(stake);
    }

    const oppCard = v.trick[opp];
    if (oppCard) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.appendChild(cardEl(oppCard, { big: true }));
      const lbl = document.createElement("span");
      lbl.className = "eyebrow";
      lbl.textContent = nameIn(v, opp) + " ha giocato";
      slot.appendChild(lbl);
      table.appendChild(slot);
    }
    const myCard = v.trick[me];
    if (myCard) {
      const slot = document.createElement("div");
      slot.className = "slot";
      slot.appendChild(cardEl(myCard, { big: true }));
      const lbl = document.createElement("span");
      lbl.className = "eyebrow";
      lbl.textContent = "La tua carta";
      slot.appendChild(lbl);
      table.appendChild(slot);
    }
    if (!oppCard && !myCard && myTurn) {
      const note = document.createElement("p");
      note.className = "note";
      note.textContent = "Apri tu la presa. " + (v.phase === 1
        ? "Vincere ti dà la carta scoperta; perdere, quella coperta."
        : "Ogni presa ora è un punto.");
      table.appendChild(note);
    }

    $("hand-owner").textContent = "Le tue carte";
    const hand = GW.sortHand(v.hand, v.trump);
    $("hand-count").textContent = hand.length + " carte";

    // legality computed from the view (host validates authoritatively anyway)
    let legal = new Set(hand);
    const leadCard = v.trick[v.leader];
    if (myTurn && v.leader !== me && leadCard) {
      const follow = hand.filter((c) => GW.suitOf(c) === GW.suitOf(leadCard));
      if (follow.length) legal = new Set(follow);
    }

    const handEl = $("hand");
    handEl.innerHTML = "";
    handEl.classList.toggle("frozen", !myTurn);
    handEl.classList.toggle("presenting", presenting);
    for (const c of hand) {
      const el = cardEl(c);
      el.dataset.card = c;
      if (v.justDrawn === c) el.classList.add("drawn");
      if (myTurn && legal.has(c)) {
        el.tabIndex = 0;
        const pick = () => selectCard(c);
        el.addEventListener("click", pick);
        el.addEventListener("keydown", (ev) => {
          if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); }
        });
      } else if (myTurn) {
        el.classList.add("illegal");
      }
      handEl.appendChild(el);
    }

    $("play-hint").textContent = myTurn && leadCard && legal.size < hand.length
      ? "Devi rispondere a " + SUIT_NAME[GW.suitOf(leadCard)].toLowerCase() + "."
      : (v.justDrawn && hand.includes(v.justDrawn) ? "La carta bordata d'oro è quella appena pescata." : "");

    const btn = $("btn-play");
    btn.disabled = true;
    btn.textContent = myTurn ? "Scegli una carta" : "Aspetta il tuo turno";
    show("screen-play");
  }

  function selectCard(card) {
    if (awaitingView) return;
    selected = card;
    document.querySelectorAll("#hand .card").forEach((el) => {
      el.classList.toggle("selected", el.dataset.card === card);
    });
    const btn = $("btn-play");
    btn.disabled = false;
    btn.textContent = "Gioca " + cardText(card);
  }

  function confirmPlay() {
    if (!selected || !view || awaitingView) return;
    const card = selected;
    const trickNum = view.trickNum;
    selected = null;
    awaitingView = true;
    $("btn-play").disabled = true;
    if (role === "host") {
      if (game && game.turn === "A" && GW.legalCards(game, "A").includes(card)) {
        GW.playCard(game, "A", card);
        broadcast();
      } else {
        awaitingView = false;
      }
    } else {
      link.send({ t: "play", card, trick: trickNum });
      // safety valve: if the confirming view never arrives, unfreeze the
      // hand and ask the host for a fresh view
      setTimeout(() => {
        if (awaitingView) {
          awaitingView = false;
          link.send({ t: "sync" });
        }
      }, 5000);
    }
  }

  function renderOver() {
    const v = view;
    const me = role === "host" ? "A" : "B";
    const w = v.winner;
    setConnPill();
    $("over-title").textContent = w === me ? "Hai vinto!" : "Vince " + nameIn(v, w);
    $("over-score").textContent = v.taken.p2[w] + "–" + v.taken.p2[GW.other(w)];
    $("over-tally").textContent =
      "Partite vinte · " + nameIn(v, "A") + " " + v.matchWins.A + " — " + v.matchWins.B + " " + nameIn(v, "B");
    const isHost = role === "host";
    $("btn-rematch").hidden = !isHost;
    $("over-wait").hidden = isHost;
    if (!isHost) $("over-wait").textContent = nameIn(v, "A") + " può iniziare la rivincita da questo schermo.";
    show("screen-over");
  }

  /* ================= connection flows ================= */

  function linkCallbacks() {
    return {
      onUp: () => {
        connected = true;
        stopWaitTimers();
        setConnPill();
        if (role === "guest") {
          link.send({ t: "join", name: myName });
          $("wait-note").textContent = "Connesso! In attesa delle carte…";
        } else if (game) {
          broadcast();   // the guest just (re)appeared: resync immediately
        }
        // first connection as host: play starts when the guest's join arrives
      },
      onMsg: (m) => (role === "host" ? hostOnMsg(m) : guestOnMsg(m)),
      onDown: () => {
        // peer discovery keeps running inside the transport; when the other
        // phone comes back, onUp fires again on its own
        connected = false;
        setConnPill();
      },
    };
  }

  /* Waiting-screen feedback: live relay status plus a hint if nothing
     connects within a reasonable time. */
  let waitTimers = [];
  function stopWaitTimers() {
    for (const t of waitTimers) { clearInterval(t); clearTimeout(t); }
    waitTimers = [];
  }
  function startWaitTimers() {
    stopWaitTimers();
    $("relay-status").textContent = "";
    if (TRANSPORT !== "bc") {
      waitTimers.push(setInterval(() => {
        if (!$("screen-wait").classList.contains("active")) return;
        try {
          const open = link && link.relayCount ? link.relayCount() : 0;
          let txt = open > 0
            ? "Rete di gioco: " + open + " relè attivi"
            : "In attesa della rete di gioco…";
          const rej = link && link.rejectReason ? link.rejectReason() : "";
          if (rej) txt += " · un relè ha rifiutato: " + rej;
          $("relay-status").textContent = txt;
        } catch (e) {}
      }, 2000));
    }
    waitTimers.push(setTimeout(() => {
      if (!$("screen-wait").classList.contains("active") || connected) return;
      $("wait-note").textContent += " Ancora niente? Controlla che il codice sia giusto e che l'altro telefono abbia la stanza aperta.";
    }, 25000));
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && link) {
      link.send({ t: "hb" });                       // re-announce presence fast
      if (role === "guest") link.send({ t: "sync" }); // and pull a fresh view
    }
  });

  /* A single lost message must never strand the guest on "waiting for
     cards": keep re-asking until the first view lands. */
  setInterval(() => {
    if (role === "guest" && connected && !view && link) {
      link.send({ t: "join", name: myName });
    }
  }, 5000);

  function genCode() {
    let c = "";
    const buf = new Uint32Array(4);
    crypto.getRandomValues(buf);
    for (let i = 0; i < 4; i++) c += CODE_ALPHABET[buf[i] % CODE_ALPHABET.length];
    return c;
  }

  function beginHost(resumed) {
    role = "host";
    awaitingView = false;
    saveHost();
    link = startLink(linkCallbacks());
    $("wait-eyebrow").textContent = "Codice stanza";
    $("room-code").textContent = room;
    $("wait-note").textContent = resumed
      ? "Stanza riaperta. Quando " + (names.B || "l'altro giocatore") + " rientra, la partita riprende da dov'era."
      : "Fai aprire questo stesso link sull'altro telefono e inserire il codice.";
    const shareBtn = $("btn-share");
    if (navigator.share) {
      shareBtn.hidden = false;
      shareBtn.onclick = () => {
        const url = location.origin + location.pathname + "?stanza=" + room;
        navigator.share({ title: "German Whist", text: "Giochiamo a German Whist? Stanza " + room + " → " + url }).catch(() => {});
      };
    }
    show("screen-wait");
    startWaitTimers();
  }

  function beginGuest() {
    role = "guest";
    awaitingView = false;
    saveGuest();
    link = startLink(linkCallbacks());
    $("wait-eyebrow").textContent = "Stanza " + room;
    $("room-code").textContent = room;
    $("wait-note").textContent = "Sto cercando l'altro telefono…";
    $("btn-share").hidden = true;
    show("screen-wait");
    startWaitTimers();
  }

  /* ================= wiring ================= */

  $("btn-create").addEventListener("click", () => {
    myName = $("my-name").value.trim().slice(0, 14);
    names = { A: myName, B: "" };
    matchWins = { A: 0, B: 0 };
    nextFirstLeader = "A";
    scored = false;
    game = null;
    room = genCode();
    $("home-error").textContent = "";
    beginHost(false);
  });

  $("btn-join").addEventListener("click", () => {
    const code = $("join-code").value.trim().toUpperCase();
    if (code.length !== 4) { $("home-error").textContent = "Il codice ha 4 caratteri."; return; }
    myName = $("my-name").value.trim().slice(0, 14);
    room = code;
    $("home-error").textContent = "";
    beginGuest();
  });

  $("btn-wait-back").addEventListener("click", () => {
    try { link && link.close(); } catch (e) {}
    link = null;
    connected = false;
    stopWaitTimers();
    show("screen-home");
  });

  $("btn-play").addEventListener("click", confirmPlay);

  $("btn-rematch").addEventListener("click", () => { if (role === "host") hostStartGame(); });

  $("btn-leave").addEventListener("click", () => {
    try { link && link.close(); } catch (e) {}
    clearSession();
    location.href = location.pathname;
  });

  /* ================= boot ================= */

  const savedHost = loadKey(HOST_KEY);
  const savedGuest = loadKey(GUEST_KEY);
  const urlRoom = (params.get("stanza") || "").toUpperCase();

  if (urlRoom.length === 4) $("join-code").value = urlRoom;

  if (savedHost && savedHost.room && savedHost.game) {
    const b = $("btn-resume-online");
    b.hidden = false;
    b.textContent = "Riapri la stanza " + savedHost.room +
      (savedHost.game.winner ? " (partita finita)" : " (presa " + savedHost.game.trickNum + ")");
    b.onclick = () => {
      room = savedHost.room;
      myName = savedHost.myName || "";
      game = savedHost.game;
      names = savedHost.names || { A: "", B: "" };
      matchWins = savedHost.matchWins || { A: 0, B: 0 };
      nextFirstLeader = savedHost.nextFirstLeader === "B" ? "B" : "A";
      scored = !!savedHost.scored;
      overlayShownFor = game.lastTrick ? game.lastTrick.num : 0;
      beginHost(true);
      acceptView(viewFor("A"));
    };
  } else if (savedGuest && savedGuest.room) {
    const b = $("btn-resume-online");
    b.hidden = false;
    b.textContent = "Rientra nella stanza " + savedGuest.room;
    b.onclick = () => {
      room = savedGuest.room;
      myName = savedGuest.myName || "";
      beginGuest();
    };
  }
  if (savedHost && savedHost.myName) $("my-name").value = savedHost.myName;
  else if (savedGuest && savedGuest.myName) $("my-name").value = savedGuest.myName;

  $("build-tag").textContent = "build " + BUILD;
  show("screen-home");
})();
</script>
</body>
</html>
